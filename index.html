<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlowingNotes — School Productivity Platform</title>
  <meta name="description" content="FlowingNotes is an all-in-one school productivity platform for tasks, notes, studying, planning, and everyday schoolwork." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M9 23c5.5 0 5.5-7 11-7' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='22' cy='11' r='2.6' fill='white'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <a class="brand" href="#/dashboard" aria-label="FlowingNotes home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="26" height="26"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M9 23c5.5 0 5.5-7 11-7" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="22" cy="11" r="2.6" fill="#fff"/></svg>
        </span>
        <span class="brand-name">FlowingNotes</span>
      </a>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <a class="nav-item" id="navContact" href="#/contact">
          <span class="nav-icon" data-icon="mail"></span><span>Contact Us</span>
        </a>
        <button class="nav-item" id="navSettings" type="button">
          <span class="nav-icon" data-icon="settings"></span><span>Settings</span>
        </button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Open menu" data-icon="menu"></button>
        <h1 class="page-title" id="pageTitle">Dashboard</h1>
        <div class="topbar-actions">
          <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle theme"></button>
          <button class="icon-btn" id="settingsBtn" type="button" aria-label="Settings" data-icon="settings"></button>
        </div>
      </header>
      <main class="view" id="view"></main>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div id="modalRoot"></div>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/tools/tasks.js"></script>
  <script src="js/tools/notes.js"></script>
  <script src="js/tools/calculator.js"></script>
  <script src="js/tools/typing.js"></script>
  <script src="js/tools/flashcards.js"></script>
  <script src="js/tools/pomodoro.js"></script>
  <script src="js/tools/grades.js"></script>
  <script src="js/tools/quiz.js"></script>
  <script src="js/tools/schedule.js"></script>
  <script src="js/tools/converter.js"></script>
  <script src="js/tools/citations.js"></script>
  <script src="js/tools/checklists.js"></script>
</body>
</html>
